name: CI

# Pull requests are verified on their own; push covers what lands on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # e2e builds first (pnpm build), then runs Playwright against out/.
      # The build's postbuild step fails when first-load JS is over the 150 KB gzipped budget.
      - run: pnpm e2e
