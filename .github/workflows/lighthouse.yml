name: Lighthouse

# Vercel's Git integration deploys previews and production; GitHub then emits deployment_status.
on:
  deployment_status:

permissions:
  contents: write

concurrency:
  group: lighthouse-${{ github.event.deployment_status.target_url }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      IS_PRODUCTION: ${{ github.event.deployment.environment == 'Production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Config asserts 100 in all four categories, LCP <= 1200 ms, CLS = 0 and TBT <= 100 ms
      # (TBT is the lab proxy for INP, which needs real interaction). One run per preset.
      - name: Lighthouse mobile
        env:
          LH_PRESET: mobile
          LH_BASE_URL: ${{ env.TARGET_URL }}
        run: pnpm dlx @lhci/cli@0.15.1 autorun
        continue-on-error: true
        id: mobile
      - name: Lighthouse desktop
        env:
          LH_PRESET: desktop
          LH_BASE_URL: ${{ env.TARGET_URL }}
        run: pnpm dlx @lhci/cli@0.15.1 autorun --collect.outputDir=.lighthouseci-desktop
        continue-on-error: true
        id: desktop

      - name: Record scores (production only)
        if: env.IS_PRODUCTION == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/record-audit.mjs .lighthouseci .lighthouseci-desktop

      - name: Commit refreshed audit data
        if: env.IS_PRODUCTION == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-audit.json data/build-stats.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh last audit and build stats [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if an audit failed
        if: steps.mobile.outcome == 'failure' || steps.desktop.outcome == 'failure'
        run: exit 1
